<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Tutor</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
}

.container {
    max-width: 500px;
    margin: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: #4a6cf7;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 18px;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.message {
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
    max-width: 80%;
}

.user {
    background: #4a6cf7;
    color: white;
    margin-left: auto;
}

.bot {
    background: #e4e7ec;
}

.input-area {
    display: flex;
    padding: 10px;
    background: white;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
}

button {
    margin-left: 10px;
    padding: 10px 15px;
    border: none;
    background: #4a6cf7;
    color: white;
    border-radius: 20px;
}
</style>
</head>

<body>

<div class="container">
    <header>Medical AI Tutor</header>

    <div id="chat"></div>

    <div class="input-area">
        <input id="message" placeholder="Ask about preeclampsia..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
let username = "student";

async function sendMessage() {
    const input = document.getElementById("message");
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            message: text,
            username: username
        })
    });

    const data = await res.json();

    if (data.reply) {
        addMessage(data.reply, "bot");
    } else {
        addMessage("Error: " + data.error, "bot");
    }
}

function addMessage(text, type) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
