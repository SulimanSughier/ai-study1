<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical AI Tutor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, Arial;
    background: #f5f7fb;
}

/* CONTAINER */
.container {
    max-width: 500px;
    margin: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */
header {
    background: #4a6cf7;
    color: white;
    padding: 16px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

/* CARD */
.card {
    background: white;
    margin: 10px;
    padding: 15px;
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

/* INPUTS */
input, textarea {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 14px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #4a6cf7;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #3b57d1;
}

/* CHAT */
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
}

/* MESSAGE */
.message {
    padding: 12px;
    margin: 6px 0;
    border-radius: 12px;
    max-width: 80%;
    font-size: 14px;
    line-height: 1.4;
}

/* USER */
.user {
    background: #4a6cf7;
    color: white;
    margin-left: auto;
}

/* BOT */
.bot {
    background: #e4e7ec;
}

/* INPUT BAR (STICKY) */
.input-bar {
    display: flex;
    padding: 10px;
    background: white;
    border-top: 1px solid #eee;
}

.input-bar textarea {
    flex: 1;
    resize: none;
    height: 45px;
}

.input-bar button {
    width: 80px;
    margin-left: 8px;
}

/* STATUS */
.status {
    text-align: center;
    font-size: 13px;
    margin-top: 5px;
}

/* HIDE */
.hidden {
    display: none;
}

/* MOBILE IMPROVEMENTS */
@media (max-width: 600px) {
    .container {
        max-width: 100%;
    }

    header {
        font-size: 16px;
    }

    .message {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>🧠 Medical AI Tutor</header>

<!-- AUTH -->
<div id="auth">

<div class="card">
<h3>Register</h3>
<input id="reg_user" placeholder="Username">
<input id="reg_pass" type="password" placeholder="Password">
<button onclick="register()">Register</button>
<div id="reg_status" class="status"></div>
</div>

<div class="card">
<h3>Login</h3>
<input id="log_user" placeholder="Username">
<input id="log_pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<div id="log_status" class="status"></div>
</div>

</div>

<!-- CHAT -->
<div id="chatUI" class="hidden" style="display:flex; flex-direction:column; height:100%;">
    
    <div id="chat"></div>

    <div class="input-bar">
        <textarea id="msg" placeholder="Ask about preeclampsia..."></textarea>
        <button onclick="send()">Send</button>
    </div>

</div>

</div>

<script>
let currentUser = null;
const BASE_URL = window.location.origin;

/* -------- REGISTER -------- */
async function register() {
    reg_status.innerText = "Creating account...";

    try {
        const res = await fetch(BASE_URL + "/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                username: reg_user.value.trim(),
                password: reg_pass.value.trim()
            })
        });

        const data = await res.json();

        reg_status.innerText =
            data.status === "created"
            ? "✅ Account created"
            : "⚠️ Username exists";

    } catch {
        reg_status.innerText = "❌ Server error";
    }
}

/* -------- LOGIN -------- */
async function login() {
    log_status.innerText = "Logging in...";

    try {
        const res = await fetch(BASE_URL + "/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                username: log_user.value.trim(),
                password: log_pass.value.trim()
            })
        });

        const data = await res.json();

        if (data.status === "success") {
            currentUser = log_user.value;
            localStorage.setItem("user", currentUser);

            auth.classList.add("hidden");
            chatUI.classList.remove("hidden");
            log_status.innerText = "";
        } else {
            log_status.innerText = "❌ Invalid login";
        }

    } catch {
        log_status.innerText = "❌ Server error";
    }
}

/* -------- SEND -------- */
async function send() {
    let text = msg.value.trim();
    if (!text) return;

    addMessage(text, "user");
    msg.value = "";

    addMessage("Typing...", "bot-temp");

    try {
        const res = await fetch(BASE_URL + "/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message: text,
                username: currentUser
            })
        });

        const data = await res.json();
        removeTempMessage();

        addMessage(data.reply || "⚠️ No response", "bot");

    } catch {
        removeTempMessage();
        addMessage("❌ Network error", "bot");
    }
}

/* -------- CHAT UI -------- */
function addMessage(text, type) {
    const div = document.createElement("div");

    if (type === "bot-temp") {
        div.id = "temp";
        div.className = "message bot";
    } else {
        div.className = "message " + (type === "user" ? "user" : "bot");
    }

    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function removeTempMessage() {
    document.getElementById("temp")?.remove();
}

/* -------- AUTO LOGIN -------- */
window.onload = () => {
    const savedUser = localStorage.getItem("user");

    if (savedUser) {
        currentUser = savedUser;
        auth.classList.add("hidden");
        chatUI.classList.remove("hidden");
    }
};
</script>

</body>
</html>
